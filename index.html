<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agieshealthfirst | Team Workspace</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    @media print {
      body * { visibility: hidden; }
      #print-mom-area, #print-mom-area * { visibility: visible; }
      #print-mom-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col pb-20 md:pb-0">

  <!-- ==================== HEADER ==================== -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-sm">
          <i data-lucide="activity" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">Agieshealthfirst</h1>
          <div class="flex items-center gap-1.5">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="sync-status" class="text-[11px] text-slate-500 font-medium">Live Google Sheets Sync</span>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs (Desktop) -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="switchTab('tasks')" class="nav-tab active-tab px-4 py-2 rounded-lg text-xs font-semibold bg-white text-teal-700 shadow-2xs flex items-center gap-2" data-target="tasks">
          <i data-lucide="check-square" class="w-4 h-4"></i> Checklist
        </button>
        <button onclick="switchTab('calendar')" class="nav-tab px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 flex items-center gap-2" data-target="calendar">
          <i data-lucide="calendar" class="w-4 h-4"></i> Calendar
        </button>
        <button onclick="switchTab('mom')" class="nav-tab px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 flex items-center gap-2" data-target="mom">
          <i data-lucide="file-text" class="w-4 h-4"></i> MOM Sheets
        </button>
        <button onclick="switchTab('notepad')" class="nav-tab px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 flex items-center gap-2" data-target="notepad">
          <i data-lucide="edit-3" class="w-4 h-4"></i> Company Notes
        </button>
      </nav>

      <!-- Member Selector & Sync Button -->
      <div class="flex items-center gap-2">
        <button onclick="fetchAllData(true)" title="Force Refresh" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 transition cursor-pointer">
          <i data-lucide="refresh-cw" id="refresh-icon" class="w-4 h-4"></i>
        </button>
        <div class="bg-slate-100 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs">
          <span class="w-2 h-2 rounded-full bg-teal-600"></span>
          <span class="text-slate-500 font-medium">Active Member:</span>
          <input type="text" id="current-user-input" value="Sumedh" onchange="updateActiveUser()" title="Change your display name"
            class="font-bold text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-teal-500 focus:outline-none w-24">
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- TAB 1: TO-DO CHECKLIST -->
    <section id="tab-tasks" class="space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 class="text-xl font-bold text-slate-900">Operational Checklist</h2>
          <p class="text-xs text-slate-500 mt-0.5">Real-time collaborative tasks synchronized across all devices</p>
        </div>
        <button onclick="openModal('task-modal')" class="inline-flex items-center justify-center gap-2 bg-teal-600 hover:bg-teal-700 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow-sm transition active:scale-95 cursor-pointer">
          <i data-lucide="plus" class="w-4 h-4"></i> Add New Task
        </button>
      </div>

      <!-- Stat Badges -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs"><span class="text-[11px] font-semibold uppercase text-slate-400">Total</span><p id="count-total" class="text-2xl font-bold text-slate-800 mt-1">0</p></div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs"><span class="text-[11px] font-semibold uppercase text-amber-500">Pending</span><p id="count-pending" class="text-2xl font-bold text-amber-600 mt-1">0</p></div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs"><span class="text-[11px] font-semibold uppercase text-emerald-500">Completed</span><p id="count-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</p></div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs"><span class="text-[11px] font-semibold uppercase text-rose-500">High Priority</span><p id="count-high" class="text-2xl font-bold text-rose-600 mt-1">0</p></div>
      </div>

      <!-- Checklist List View -->
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-2xs">
        <div class="p-3 bg-slate-50/50 border-b border-slate-100 flex flex-wrap gap-2 items-center justify-between">
          <div class="flex items-center gap-2">
            <button onclick="filterTasks('all')" class="task-filter-btn px-3 py-1 rounded-lg text-xs font-semibold bg-white border border-slate-200 text-teal-700 shadow-2xs">All</button>
            <button onclick="filterTasks('Pending')" class="task-filter-btn px-3 py-1 rounded-lg text-xs
