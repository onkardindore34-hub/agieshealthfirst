<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agieshealthfirst | Team Workspace</title>
  
  <!-- Suppress Tailwind CDN production warning banner in console -->
  <script>
    (function() {
      const origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        origWarn.apply(console, args);
      };
    })();
  </script>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #print-mom-area, #print-mom-area * {
        visibility: visible;
      }
      #print-mom-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col pb-20 md:pb-0">

  <!-- ==================== AUTH GATE MODAL ==================== -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-100 overflow-hidden">
      <div class="bg-gradient-to-r from-teal-700 to-emerald-600 p-6 text-white text-center">
        <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur-md border border-white/20">
          <i data-lucide="shield-plus" class="w-8 h-8 text-white"></i>
        </div>
        <h2 class="text-2xl font-bold tracking-tight">Agieshealthfirst</h2>
        <p class="text-teal-100 text-xs mt-1 uppercase tracking-widest font-semibold">Collaborative Cloud Workspace</p>
      </div>
      
      <form id="login-form" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Login ID</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </span>
            <input type="text" id="login-id" required placeholder="e.g. AHF007"
              class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none uppercase tracking-wider font-medium">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </span>
            <input type="password" id="login-pass" required placeholder="Enter password"
              class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
          </div>
        </div>

        <div id="login-error" class="hidden p-3 bg-rose-50 text-rose-700 text-xs rounded-lg font-medium border border-rose-200"></div>

        <button type="submit" id="login-btn"
          class="w-full py-3 bg-teal-600 hover:bg-teal-700 active:scale-[0.99] text-white font-semibold rounded-xl text-sm transition-all shadow-md shadow-teal-600/20 flex items-center justify-center gap-2">
          <span>Authenticate & Access</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
      <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400">Default Access: ID <span class="font-bold text-slate-600">AHF007</span> | Pass <span class="font-bold text-slate-600">Sumedh</span></p>
      </div>
    </div>
  </div>

  <!-- ==================== HEADER ==================== -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-sm">
          <i data-lucide="activity" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">Agieshealthfirst</h1>
          <div class="flex items-center gap-1.5">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="sync-status" class="text-[11px] text-slate-500 font-medium">Google Sheets Live Sync</span>
          </div>
        </div>
      </div>

      <!-- Desktop Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="switchTab('tasks')" class="nav-tab active-tab px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2" data-target="tasks">
          <i data-lucide="check-square" class="w-4 h-4"></i> Checklist
        </button>
        <button onclick="switchTab('calendar')" class="nav-tab px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center gap-2" data-target="calendar">
          <i data-lucide="calendar" class="w-4 h-4"></i> Calendar
        </button>
        <button onclick="switchTab('mom')" class="nav-tab px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center gap-2" data-target="mom">
          <i data-lucide="file-text" class="w-4 h-4"></i> MOM Sheets
        </button>
        <button onclick="switchTab('notepad')" class="nav-tab px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center gap-2" data-target="notepad">
          <i data-lucide="edit-3" class="w-4 h-4"></i> Company Notes
        </button>
        <button onclick="switchTab('developer')" id="dev-tab-btn" class="nav-tab px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center gap-2" data-target="developer">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Developer
        </button>
      </nav>

      <!-- User Profile Badge & Logout -->
      <div class="flex
